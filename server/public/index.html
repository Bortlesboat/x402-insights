<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AgentOps Ledger</title>
<style>
  :root {
    --bg: #f5f7f4;
    --panel: #ffffff;
    --ink: #17201b;
    --muted: #66736c;
    --line: #dbe2dd;
    --soft: #edf2ee;
    --brand: #245d4b;
    --brand-ink: #0f3228;
    --ok: #1f7a4c;
    --warn: #a66b00;
    --bad: #b83a3a;
    --blue: #315f9f;
    --shadow: 0 16px 36px rgba(23, 32, 27, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", Arial, sans-serif;
  }
  header {
    border-bottom: 1px solid var(--line);
    background: rgba(245, 247, 244, 0.94);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar {
    max-width: 1360px;
    margin: 0 auto;
    padding: 18px 24px;
    display: grid;
    grid-template-columns: minmax(220px, 1fr) auto;
    gap: 18px;
    align-items: center;
  }
  h1 {
    margin: 0;
    font-size: 21px;
    line-height: 1.1;
    font-weight: 700;
    letter-spacing: 0;
  }
  .sub {
    margin-top: 4px;
    color: var(--muted);
    font-size: 13px;
  }
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: flex-end;
  }
  label {
    display: grid;
    gap: 4px;
    color: var(--muted);
    font-size: 12px;
  }
  select {
    min-width: 96px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    color: var(--ink);
    padding: 7px 10px;
    font-size: 13px;
  }
  main {
    max-width: 1360px;
    margin: 0 auto;
    padding: 22px 24px 38px;
  }
  .metrics {
    display: grid;
    grid-template-columns: repeat(6, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .metric {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 13px 14px;
    min-width: 0;
  }
  .metric .label {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
  }
  .metric .value {
    margin-top: 5px;
    font-size: 22px;
    line-height: 1.1;
    font-weight: 700;
    overflow-wrap: anywhere;
  }
  .layout {
    display: grid;
    grid-template-columns: minmax(360px, 0.92fr) minmax(480px, 1.35fr);
    gap: 16px;
    align-items: start;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--shadow);
    min-width: 0;
  }
  .panel-header {
    padding: 15px 16px 12px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .panel h2 {
    margin: 0;
    font-size: 14px;
    line-height: 1.2;
  }
  .panel-body { padding: 12px 16px 16px; }
  .run-list {
    display: grid;
    gap: 8px;
  }
  .run-row {
    width: 100%;
    text-align: left;
    background: var(--soft);
    border: 1px solid transparent;
    border-radius: 7px;
    padding: 11px 12px;
    color: var(--ink);
    cursor: pointer;
  }
  .run-row:hover,
  .run-row.active {
    border-color: color-mix(in srgb, var(--brand) 45%, var(--line));
    background: #e7eee9;
  }
  .run-title {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: start;
    font-size: 13px;
    font-weight: 700;
  }
  .run-meta {
    margin-top: 7px;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 6px;
    color: var(--muted);
    font-size: 12px;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    min-height: 22px;
    border-radius: 999px;
    padding: 3px 8px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0;
    white-space: nowrap;
  }
  .pill.success { background: #dcefe5; color: var(--ok); }
  .pill.error { background: #f4dddd; color: var(--bad); }
  .pill.running { background: #f6ebd4; color: var(--warn); }
  .risk-flags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .detail-metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
    gap: 8px;
    margin-bottom: 12px;
  }
  .detail-metrics .metric .value {
    font-size: 20px;
  }
  .flag {
    border: 1px solid #ead2a5;
    background: #fff6e6;
    color: #7d5200;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
  }
  .timeline {
    display: grid;
    gap: 10px;
    margin-top: 14px;
  }
  .event {
    display: grid;
    grid-template-columns: 106px 1fr auto;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid var(--line);
  }
  .event:last-child { border-bottom: 0; }
  .event-time {
    color: var(--muted);
    font-size: 12px;
  }
  .event-main {
    min-width: 0;
  }
  .event-name {
    font-weight: 700;
    font-size: 13px;
    overflow-wrap: anywhere;
  }
  .event-sub {
    margin-top: 3px;
    color: var(--muted);
    font-size: 12px;
    overflow-wrap: anywhere;
  }
  .event-cost {
    text-align: right;
    font-weight: 700;
    font-size: 13px;
    min-width: 70px;
  }
  .lower-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 16px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    text-align: left;
    color: var(--muted);
    font-weight: 600;
    padding: 8px 6px;
    border-bottom: 1px solid var(--line);
  }
  td {
    padding: 8px 6px;
    border-bottom: 1px solid var(--soft);
    overflow-wrap: anywhere;
  }
  td:nth-child(2),
  td:nth-child(3),
  th:nth-child(2),
  th:nth-child(3) {
    white-space: nowrap;
  }
  tr:last-child td { border-bottom: 0; }
  .bar-cell {
    min-width: 110px;
  }
  .bar {
    height: 8px;
    border-radius: 999px;
    background: var(--soft);
    overflow: hidden;
  }
  .bar span {
    display: block;
    height: 100%;
    background: var(--brand);
  }
  .link {
    color: var(--brand-ink);
    font-weight: 700;
    text-decoration: none;
    border-bottom: 1px solid color-mix(in srgb, var(--brand) 40%, transparent);
  }
  .muted { color: var(--muted); }
  .empty {
    padding: 18px;
    color: var(--muted);
    background: var(--soft);
    border-radius: 7px;
    font-size: 13px;
  }
  @media (max-width: 980px) {
    .topbar,
    .layout,
    .lower-grid {
      grid-template-columns: 1fr;
    }
    .filters { justify-content: start; }
    .metrics { grid-template-columns: repeat(2, minmax(130px, 1fr)); }
  }
  @media (max-width: 560px) {
    main, .topbar { padding-left: 14px; padding-right: 14px; }
    .metrics { grid-template-columns: 1fr; }
    .event { grid-template-columns: 1fr; gap: 5px; }
    .event-cost { text-align: left; }
    .run-meta { grid-template-columns: 1fr 1fr; }
    table { font-size: 12px; }
    th, td { padding: 7px 4px; }
    .bar-cell { min-width: 74px; }
  }
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div>
      <h1>AgentOps Ledger</h1>
      <div class="sub">flight recorder for enterprise agents</div>
    </div>
    <div class="filters">
      <label>env
        <select id="env">
          <option value="all" selected>all</option>
          <option value="prod">prod</option>
          <option value="testnet">testnet</option>
          <option value="dev">dev</option>
        </select>
      </label>
      <label>mode
        <select id="mode">
          <option value="all" selected>all</option>
          <option value="live">live</option>
          <option value="demo">demo</option>
        </select>
      </label>
      <label>window
        <select id="window">
          <option value="1">1h</option>
          <option value="24" selected>24h</option>
          <option value="168">7d</option>
          <option value="720">30d</option>
        </select>
      </label>
    </div>
  </div>
</header>
<main>
  <section class="metrics" id="metrics"></section>

  <section class="layout">
    <div class="panel">
      <div class="panel-header">
        <h2>Recent agent runs</h2>
        <span class="muted" id="runCount">0 runs</span>
      </div>
      <div class="panel-body">
        <div class="run-list" id="runList"></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2 id="detailTitle">Run timeline</h2>
        <a class="link" id="exportLink" href="#" target="_blank" rel="noreferrer">export JSON</a>
      </div>
      <div class="panel-body" id="runDetail"></div>
    </div>
  </section>

  <section class="lower-grid">
    <div class="panel">
      <div class="panel-header"><h2>Spend by endpoint</h2></div>
      <div class="panel-body"><table id="endpointTable"></table></div>
    </div>
    <div class="panel">
      <div class="panel-header"><h2>Spend by agent</h2></div>
      <div class="panel-body"><table id="agentTable"></table></div>
    </div>
  </section>
</main>
<script>
const fmt = {
  usd: (n) => "$" + (Number(n) || 0).toFixed(4),
  pct: (n) => ((Number(n) || 0) * 100).toFixed(1) + "%",
  ms: (n) => Math.round(Number(n) || 0) + "ms",
  int: (n) => (Number(n) || 0).toLocaleString(),
  time: (s) => s ? new Date(s).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "-",
};

let selectedRunId = null;
let lastRuns = [];

async function json(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function qs() {
  const h = document.getElementById("window").value;
  const m = document.getElementById("mode").value;
  const e = document.getElementById("env").value;
  return `hours=${h}&mode=${m}&env=${e}`;
}

function statusPill(status) {
  const safe = status || "running";
  return `<span class="pill ${safe}">${safe}</span>`;
}

function duration(run) {
  if (!run.started_at || !run.finished_at) return "-";
  return fmt.ms(new Date(run.finished_at) - new Date(run.started_at));
}

function renderMetrics(overview, runs) {
  const errors = runs.reduce((sum, run) => sum + Number(run.error_count || 0), 0);
  const approvals = runs.reduce((sum, run) => sum + Number(run.approval_count || 0), 0);
  const runSpend = runs.reduce((sum, run) => sum + Number(run.total_cost || 0), 0);
  document.getElementById("metrics").innerHTML = `
    <div class="metric"><div class="label">Runs</div><div class="value">${fmt.int(runs.length)}</div></div>
    <div class="metric"><div class="label">Run spend</div><div class="value">${fmt.usd(runSpend)}</div></div>
    <div class="metric"><div class="label">Approvals</div><div class="value">${fmt.int(approvals)}</div></div>
    <div class="metric"><div class="label">Errors</div><div class="value">${fmt.int(errors)}</div></div>
    <div class="metric"><div class="label">Retry spend</div><div class="value">${fmt.pct(overview.retry_spend_pct)}</div></div>
    <div class="metric"><div class="label">Requests</div><div class="value">${fmt.int(overview.requests)}</div></div>
  `;
}

function renderRunList(runs) {
  document.getElementById("runCount").textContent = `${runs.length} ${runs.length === 1 ? "run" : "runs"}`;
  if (!runs.length) {
    document.getElementById("runList").innerHTML = `<div class="empty">No agent runs yet. Run npm run seed or instrument your agent with startRun().</div>`;
    return;
  }
  document.getElementById("runList").innerHTML = runs.map((run) => `
    <button class="run-row ${run.run_id === selectedRunId ? "active" : ""}" data-run="${run.run_id}">
      <div class="run-title">
        <span>${run.workflow}</span>
        ${statusPill(run.status)}
      </div>
      <div class="muted" style="margin-top:4px">${run.agent}</div>
      <div class="run-meta">
        <span>${fmt.usd(run.total_cost)}</span>
        <span>${fmt.int(run.event_count)} events</span>
        <span>${fmt.int(run.approval_count)} approvals</span>
        <span>${duration(run)}</span>
      </div>
    </button>
  `).join("");

  document.querySelectorAll("[data-run]").forEach((row) => {
    row.addEventListener("click", () => {
      selectedRunId = row.getAttribute("data-run");
      refreshDetail();
      renderRunList(lastRuns);
    });
  });
}

function eventLabel(event) {
  if (event.event_type === "tool_call") return event.tool_name || event.endpoint;
  if (event.event_type === "approval") return `${event.approval_status || "approval"}: ${event.step_name || "human gate"}`;
  if (event.event_type === "payment") return event.phase ? `${event.phase}: ${event.endpoint}` : event.endpoint;
  if (event.event_type === "run_finish") return event.summary || "run finished";
  return event.step_name || event.event_type || event.endpoint;
}

function renderRunDetail(detail) {
  const exportLink = document.getElementById("exportLink");
  exportLink.style.visibility = "visible";
  exportLink.href = `/api/runs/${detail.run.run_id}/export`;
  document.getElementById("detailTitle").textContent = detail.run.workflow;

  const flags = detail.risk_flags && detail.risk_flags.length
    ? `<div class="risk-flags">${detail.risk_flags.map((flag) => `<span class="flag">${flag.replaceAll("_", " ")}</span>`).join("")}</div>`
    : `<div class="risk-flags"><span class="pill success">clear</span></div>`;

  document.getElementById("runDetail").innerHTML = `
    <div class="detail-metrics">
      <div class="metric"><div class="label">Status</div><div class="value">${detail.run.status}</div></div>
      <div class="metric"><div class="label">Cost</div><div class="value">${fmt.usd(detail.summary.total_cost)}</div></div>
      <div class="metric"><div class="label">Events</div><div class="value">${fmt.int(detail.summary.event_count)}</div></div>
      <div class="metric"><div class="label">Errors</div><div class="value">${fmt.int(detail.summary.error_count)}</div></div>
    </div>
    ${flags}
    <div class="timeline">
      ${detail.events.map((event) => `
        <div class="event">
          <div class="event-time">${fmt.time(event.timestamp)}<br><span class="muted">${event.event_type || "-"}</span></div>
          <div class="event-main">
            <div class="event-name">${eventLabel(event)}</div>
            <div class="event-sub">${event.endpoint || "-"}${event.error ? ` - ${event.error}` : ""}</div>
          </div>
          <div class="event-cost">${fmt.usd(event.cost)}<br><span class="${event.status === "error" ? "pill error" : "pill success"}">${event.status}</span></div>
        </div>
      `).join("")}
    </div>
  `;
}

function renderEmptyDetail() {
  document.getElementById("exportLink").style.visibility = "hidden";
  document.getElementById("detailTitle").textContent = "Run timeline";
  document.getElementById("runDetail").innerHTML = `<div class="empty">Select a run to inspect the audit trail.</div>`;
}

function renderTable(el, headers, rows, cells) {
  if (!rows.length) {
    el.innerHTML = `<tbody><tr><td class="muted">No data yet</td></tr></tbody>`;
    return;
  }
  const max = Math.max(...rows.map((row) => Number(row.total_cost || 0)), 0.000001);
  el.innerHTML = `<thead><tr>${headers.map((h) => `<th>${h}</th>`).join("")}</tr></thead>` +
    `<tbody>${rows.map((row) => `<tr>${cells(row, max).map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody>`;
}

async function refreshDetail() {
  if (!selectedRunId) {
    renderEmptyDetail();
    return;
  }
  const detail = await json(`/api/runs/${selectedRunId}`);
  renderRunDetail(detail);
}

async function refresh() {
  const query = qs();
  const [overview, runs, byEndpoint, byAgent] = await Promise.all([
    json(`/api/overview?${query}`),
    json("/api/runs?limit=20"),
    json(`/api/by-endpoint?${query}`),
    json(`/api/by-agent?${query}`),
  ]);
  lastRuns = runs;
  if (!selectedRunId && runs.length) selectedRunId = runs[0].run_id;
  if (selectedRunId && !runs.some((run) => run.run_id === selectedRunId)) {
    selectedRunId = runs[0]?.run_id || null;
  }
  renderMetrics(overview, runs);
  renderRunList(runs);
  await refreshDetail();
  renderTable(
    document.getElementById("endpointTable"),
    ["endpoint", "requests", "total", "weight"],
    byEndpoint,
    (row, max) => [
      row.endpoint,
      fmt.int(row.requests),
      fmt.usd(row.total_cost),
      `<div class="bar-cell"><div class="bar"><span style="width:${Math.max(4, Number(row.total_cost || 0) / max * 100)}%"></span></div></div>`,
    ],
  );
  renderTable(
    document.getElementById("agentTable"),
    ["agent", "requests", "total", "weight"],
    byAgent,
    (row, max) => [
      row.agent,
      fmt.int(row.requests),
      fmt.usd(row.total_cost),
      `<div class="bar-cell"><div class="bar"><span style="width:${Math.max(4, Number(row.total_cost || 0) / max * 100)}%"></span></div></div>`,
    ],
  );
}

document.getElementById("window").addEventListener("change", refresh);
document.getElementById("mode").addEventListener("change", refresh);
document.getElementById("env").addEventListener("change", refresh);
refresh().catch((err) => {
  console.error(err);
  renderEmptyDetail();
});
setInterval(() => refresh().catch(console.error), 5000);
</script>
</body>
</html>
